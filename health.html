<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-input: rgba(0, 0, 0, 0.28);
  --bg-input-focus: rgba(0, 0, 0, 0.38);
  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.12);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;
  --accent: #1D9E75;
  --font: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body { min-height: 100vh; overflow-x: hidden; }

body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(60% 50% at 75% 10%, rgba(29, 158, 117, 0.12) 0%, transparent 60%),
    radial-gradient(50% 40% at 20% 85%, rgba(180, 180, 200, 0.06) 0%, transparent 60%);
  filter: blur(40px);
  pointer-events: none; z-index: 0;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none; z-index: 1;
}

main {
  position: relative; z-index: 2;
  max-width: 720px; margin: 0 auto;
  padding: 28px 20px 80px;
}

.section { margin-bottom: 28px; }

.section-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin: 0 2px 10px;
}

.section-label-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}

.card {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 20px 22px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}

/* Inputs */
.input {
  font-size: 14px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: var(--font);
  width: 100%;
  transition: border-color 0.18s, background 0.18s;
}
.input::placeholder { color: var(--text-tertiary); }
.input:focus { outline: none; border-color: rgba(255,255,255,0.35); background: var(--bg-input-focus); }
select.input { cursor: pointer; }
textarea.input { resize: none; min-height: 88px; line-height: 1.6; }

/* Buttons */
.btn {
  font-size: 13px; font-weight: 700;
  padding: 10px 20px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.85);
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
  color: #0A0A0B;
  cursor: pointer; font-family: var(--font);
  transition: transform 0.12s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 4px 14px rgba(0,0,0,0.30);
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-secondary);
  box-shadow: none;
  font-size: 12px; font-weight: 700;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer; font-family: var(--font);
  transition: background 0.15s;
}
.btn-ghost:hover { background: rgba(255,255,255,0.05); }
.btn-ghost.active {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.25);
  color: var(--text-primary);
}

/* Weight */
.weight-display {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 18px;
}
.weight-big {
  font-size: 52px; font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.04em; line-height: 1;
}
.weight-unit-label {
  font-size: 14px; color: var(--text-tertiary); font-weight: 600;
}
.log-row { display: flex; gap: 10px; align-items: flex-end; }
.log-row .input { flex: 1; }

.weight-history { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
.history-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 10px;
}
.history-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  font-size: 13px;
}
.history-row:last-child { border-bottom: none; }
.history-date { color: var(--text-tertiary); font-size: 11px; }
.history-vals { display: flex; gap: 10px; align-items: center; }
.history-wt { color: var(--text-primary); font-weight: 700; }
.history-delta { font-size: 11px; font-weight: 700; }
.delta-up { color: #FF8A8A; }
.delta-down { color: #6BE3A4; }

/* Calories */
.cal-mode-row { display: flex; gap: 6px; margin-bottom: 18px; }
.cal-mode-row .btn-ghost { flex: 1; text-align: center; padding: 8px 4px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }

.cal-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
}
.cal-cell {
  background: rgba(255,255,255,0.03);
  border-radius: 10px; padding: 14px;
  text-align: center; border: 1px solid var(--border);
}
.cal-cell.highlight {
  background: rgba(29,158,117,0.10);
  border-color: rgba(29,158,117,0.25);
}
.cal-cell-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 5px;
}
.cal-cell-value {
  font-size: 22px; font-weight: 800;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.cal-cell.highlight .cal-cell-value { color: #6BE3A4; }
.cal-cell-sub { font-size: 10px; color: var(--text-tertiary); margin-top: 3px; }

.profile-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px;
}
.field-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.10em;
  text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 5px; display: block;
}
.tdee-line {
  font-size: 12px; color: var(--text-tertiary); margin-bottom: 16px;
}
.tdee-line strong { color: var(--text-secondary); font-weight: 700; }

/* Target */
.target-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

/* Plan */
.plan-field { margin-bottom: 14px; }
.plan-field:last-child { margin-bottom: 0; }

@media (max-width: 480px) {
  main { padding: 20px 14px 80px; }
  .weight-big { font-size: 42px; }
  .cal-cell-value { font-size: 18px; }
}

::selection { background: rgba(29,158,117,0.3); color: var(--text-primary); }
</style>
</head>
<body>
<main>

  <!-- WEIGHT -->
  <div class="section">
    <div class="section-label-row">
      <div class="section-label">Weight</div>
      <button class="btn-ghost" id="unitToggle">kg</button>
    </div>
    <div class="card">
      <div class="weight-display">
        <div class="weight-big" id="weightDisplay">—</div>
        <div class="weight-unit-label" id="weightUnitLabel">not logged yet</div>
      </div>
      <div class="log-row">
        <input class="input" id="weightInput" type="number" step="0.1" placeholder="Enter weight" inputmode="decimal">
        <button class="btn" id="logWeightBtn">Log</button>
      </div>
      <div class="weight-history" id="weightHistory"></div>
    </div>
  </div>

  <!-- CALORIES -->
  <div class="section">
    <div class="section-label">Calories</div>
    <div class="card">
      <div class="tdee-line">Maintenance: <strong id="tdeeVal">—</strong> kcal &nbsp;·&nbsp; Fill in your stats below to calculate</div>
      <div class="cal-mode-row">
        <button class="btn-ghost" data-mode="cut">Cut &minus;500</button>
        <button class="btn-ghost active" data-mode="maintain">Maintain</button>
        <button class="btn-ghost" data-mode="bulk">Bulk +300</button>
      </div>
      <div class="cal-grid">
        <div class="cal-cell highlight">
          <div class="cal-cell-label">Target</div>
          <div class="cal-cell-value" id="calTarget">—</div>
          <div class="cal-cell-sub">kcal/day</div>
        </div>
        <div class="cal-cell">
          <div class="cal-cell-label">Protein</div>
          <div class="cal-cell-value" id="calProtein">—</div>
          <div class="cal-cell-sub">g/day</div>
        </div>
        <div class="cal-cell">
          <div class="cal-cell-label">BMR</div>
          <div class="cal-cell-value" id="calBmr">—</div>
          <div class="cal-cell-sub">base rate</div>
        </div>
      </div>
      <div class="profile-grid">
        <div>
          <label class="field-label" for="profHeight">Height (cm)</label>
          <input class="input" id="profHeight" type="number" placeholder="175" inputmode="decimal">
        </div>
        <div>
          <label class="field-label" for="profAge">Age</label>
          <input class="input" id="profAge" type="number" placeholder="25" inputmode="numeric">
        </div>
        <div>
          <label class="field-label" for="profSex">Sex</label>
          <select class="input" id="profSex">
            <option value="m">Male</option>
            <option value="f">Female</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="profActivity">Activity</label>
          <select class="input" id="profActivity">
            <option value="1.2">Sedentary</option>
            <option value="1.375">Light (1–3×/wk)</option>
            <option value="1.55">Moderate (3–5×/wk)</option>
            <option value="1.725">Active (6–7×/wk)</option>
            <option value="1.9">Very active</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- TARGET PHYSIQUE -->
  <div class="section">
    <div class="section-label">Target Physique</div>
    <div class="card">
      <div class="target-grid">
        <div>
          <label class="field-label" for="targetWeight">Goal weight</label>
          <input class="input" id="targetWeight" type="number" step="0.1" placeholder="75" inputmode="decimal">
        </div>
        <div>
          <label class="field-label" for="targetBf">Body fat %</label>
          <input class="input" id="targetBf" type="number" step="0.5" placeholder="12" inputmode="decimal">
        </div>
      </div>
      <label class="field-label" for="targetDesc">Describe your goal</label>
      <textarea class="input" id="targetDesc" placeholder="e.g. 185 lbs, lean and athletic, visible abs, broad shoulders — what does your goal physique look like?"></textarea>
    </div>
  </div>

  <!-- PLAN -->
  <div class="section">
    <div class="section-label">How to Get There</div>
    <div class="card">
      <div class="plan-field">
        <label class="field-label" for="planTraining">Training split</label>
        <textarea class="input" id="planTraining" placeholder="e.g. Push / Pull / Legs, 5 days/week, progressive overload on compounds..."></textarea>
      </div>
      <div class="plan-field">
        <label class="field-label" for="planDiet">Diet approach</label>
        <textarea class="input" id="planDiet" placeholder="e.g. High protein 200g/day, 400 kcal deficit, meal prep Sundays, caffeine pre-workout..."></textarea>
      </div>
      <div class="plan-field">
        <label class="field-label" for="planNotes">Notes & habits</label>
        <textarea class="input" id="planNotes" placeholder="Weekly check-ins, sleep targets, anything else you want to track..."></textarea>
      </div>
    </div>
  </div>

</main>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const set = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  let profile = get('health:profile') || { heightCm: '', age: '', sex: 'm', activityLevel: '1.55', unit: 'kg' };
  let weightLog = get('health:weight') || {};
  let target = get('health:target') || { weight: '', bodyFat: '', description: '' };
  let plan = get('health:plan') || { training: '', diet: '', notes: '' };
  let calMode = 'maintain';

  // Unit toggle
  const unitBtn = $('unitToggle');
  unitBtn.textContent = profile.unit || 'kg';
  unitBtn.addEventListener('click', () => {
    profile.unit = profile.unit === 'kg' ? 'lbs' : 'kg';
    set('health:profile', profile);
    unitBtn.textContent = profile.unit;
    renderWeight();
    calcCalories();
  });

  function toKg(v) { return profile.unit === 'lbs' ? v / 2.20462 : v; }
  function fromKg(kg) { return profile.unit === 'lbs' ? kg * 2.20462 : kg; }
  function fmtW(kg) { return fromKg(kg).toFixed(1); }

  // Log weight
  $('logWeightBtn').addEventListener('click', () => {
    const raw = parseFloat($('weightInput').value);
    if (isNaN(raw) || raw <= 0) return;
    weightLog[todayStr()] = toKg(raw);
    set('health:weight', weightLog);
    $('weightInput').value = '';
    renderWeight();
    calcCalories();
  });
  $('weightInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('logWeightBtn').click(); });

  function renderWeight() {
    const entries = Object.entries(weightLog).sort((a, b) => b[0].localeCompare(a[0]));
    const latest = entries[0];
    if (latest) {
      $('weightDisplay').textContent = fmtW(latest[1]);
      $('weightUnitLabel').textContent = profile.unit;
    } else {
      $('weightDisplay').textContent = '—';
      $('weightUnitLabel').textContent = 'not logged yet';
    }

    const hist = $('weightHistory');
    if (entries.length === 0) {
      hist.innerHTML = '<div style="font-size:12px;color:var(--text-tertiary);padding:4px 0">No entries yet.</div>';
      return;
    }
    const recent = entries.slice(0, 7);
    hist.innerHTML = '<div class="history-label">Last 7 entries</div>' +
      recent.map(([date, kg], i) => {
        const prev = recent[i + 1];
        let delta = '';
        if (prev) {
          const diff = fromKg(kg) - fromKg(prev[1]);
          const sign = diff > 0 ? '+' : '';
          const cls = diff > 0 ? 'delta-up' : 'delta-down';
          delta = `<span class="history-delta ${cls}">${sign}${diff.toFixed(1)}</span>`;
        }
        const [y, m, d] = date.split('-');
        const label = new Date(+y, +m - 1, +d).toLocaleDateString('en', { month: 'short', day: 'numeric' });
        return `<div class="history-row">
          <span class="history-date">${label}</span>
          <div class="history-vals">
            <span class="history-wt">${fmtW(kg)} ${profile.unit}</span>
            ${delta}
          </div>
        </div>`;
      }).join('');
  }

  // Calorie calculator
  function calcCalories() {
    const h = parseFloat(profile.heightCm);
    const a = parseFloat(profile.age);
    const act = parseFloat(profile.activityLevel);
    const entries = Object.entries(weightLog).sort((a, b) => b[0].localeCompare(a[0]));
    const wKg = entries.length ? entries[0][1] : null;

    if (!h || !a || !act || !wKg) {
      $('tdeeVal').textContent = '—';
      $('calTarget').textContent = '—';
      $('calProtein').textContent = '—';
      $('calBmr').textContent = '—';
      return;
    }

    const bmr = profile.sex === 'f'
      ? 10 * wKg + 6.25 * h - 5 * a - 161
      : 10 * wKg + 6.25 * h - 5 * a + 5;
    const tdee = Math.round(bmr * act);
    const offsets = { cut: -500, maintain: 0, bulk: 300 };
    const targetCal = Math.round(tdee + offsets[calMode]);
    const protein = Math.round(wKg * 2.2);

    $('tdeeVal').textContent = tdee.toLocaleString();
    $('calTarget').textContent = targetCal.toLocaleString();
    $('calProtein').textContent = protein;
    $('calBmr').textContent = Math.round(bmr).toLocaleString();
  }

  // Mode buttons
  document.querySelectorAll('.cal-mode-row .btn-ghost').forEach(btn => {
    btn.addEventListener('click', () => {
      calMode = btn.dataset.mode;
      document.querySelectorAll('.cal-mode-row .btn-ghost').forEach(b => b.classList.toggle('active', b.dataset.mode === calMode));
      calcCalories();
    });
  });

  // Profile inputs
  function bindProfile(id, key) {
    const el = $(id);
    if (!el) return;
    if (profile[key] !== undefined && profile[key] !== '') el.value = profile[key];
    el.addEventListener('change', () => {
      profile[key] = el.value;
      set('health:profile', profile);
      calcCalories();
    });
  }
  bindProfile('profHeight', 'heightCm');
  bindProfile('profAge', 'age');
  bindProfile('profSex', 'sex');
  bindProfile('profActivity', 'activityLevel');

  // Target physique (auto-save on input)
  function bindTarget(id, key) {
    const el = $(id);
    if (target[key]) el.value = target[key];
    el.addEventListener('input', () => { target[key] = el.value; set('health:target', target); });
  }
  bindTarget('targetWeight', 'weight');
  bindTarget('targetBf', 'bodyFat');
  bindTarget('targetDesc', 'description');

  // Plan (auto-save on input)
  function bindPlan(id, key) {
    const el = $(id);
    if (plan[key]) el.value = plan[key];
    el.addEventListener('input', () => { plan[key] = el.value; set('health:plan', plan); });
  }
  bindPlan('planTraining', 'training');
  bindPlan('planDiet', 'diet');
  bindPlan('planNotes', 'notes');

  // Cross-tab/cross-device sync
  window.addEventListener('storage', () => {
    profile = get('health:profile') || profile;
    weightLog = get('health:weight') || weightLog;
    target = get('health:target') || target;
    plan = get('health:plan') || plan;
    unitBtn.textContent = profile.unit || 'kg';
    renderWeight();
    calcCalories();
    bindTarget('targetWeight', 'weight');
    bindTarget('targetBf', 'bodyFat');
    bindTarget('targetDesc', 'description');
    bindPlan('planTraining', 'training');
    bindPlan('planDiet', 'diet');
    bindPlan('planNotes', 'notes');
  });

  renderWeight();
  calcCalories();
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof initCloudSync !== 'function') return;
  initCloudSync({
    appKey: 'health',
    syncedKeys: ['health:profile', 'health:weight', 'health:target', 'health:plan'],
    onApplied: function () { window.dispatchEvent(new Event('storage')); }
  });
});
</script>
</body>
</html>
